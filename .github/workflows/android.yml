name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Release bundle (signed when secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_REQUIRE_REAL_ADS: ${{ vars.REQUIRE_REAL_ADS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew --no-daemon bundleRelease

      # Release assets are reachable from the build/sign environment; workflow artifacts are not.
      - name: Publish build to the rolling "ci-build" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-build >/dev/null 2>&1 || gh release create ci-build --prerelease --title "CI build" --notes "Latest main build. Unsigned AAB for internal signing; debug APK for testing."
          cp app/build/outputs/bundle/release/app-release.aab app-release-unsigned.aab
          gh release upload ci-build app-release-unsigned.aab app/build/outputs/apk/debug/app-debug.apk --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
