name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon testDebugUnitTest -Proborazzi.test.record=true lintDebug assembleDebug

      - name: Release bundle (signed when secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew --no-daemon bundleRelease

      # Build outputs are handed to the private signing step encrypted, so the public
      # release only holds ciphertext (ci/transfer_pub.pem; the private key is not in the repo).
      - name: Publish encrypted build outputs
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir enc
          openssl rand -out key.bin 32
          openssl pkeyutl -encrypt -pubin -inkey ci/transfer_pub.pem -pkeyopt rsa_padding_mode:oaep -in key.bin -out enc/key.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.bin -in app/build/outputs/bundle/release/app-release.aab -out enc/aab.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.bin -in app/build/outputs/apk/debug/app-debug.apk -out enc/apk.enc
          tar -czf shots.tgz -C app/build/outputs/store .
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:key.bin -in shots.tgz -out enc/shots.enc
          echo "${{ github.sha }}" > enc/sha.txt
          rm key.bin
          gh release view ci-build >/dev/null 2>&1 || gh release create ci-build --prerelease --title "CI build (encrypted)" --notes "Encrypted build outputs for the signing step. Not installable."
          gh release upload ci-build enc/* --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
