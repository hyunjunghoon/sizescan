org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AdMob IDs are not secret (they ship inside the APK). Release builds use them only when
# USE_REAL_ADS=true; otherwise every build uses Google's test IDs. Keep it false for
# closed-testing uploads and flip it to true for the production build. Debug builds always
# use test IDs.
ADMOB_APP_ID=ca-app-pub-1211591848059765~1902031108
ADMOB_BANNER_ID=ca-app-pub-1211591848059765/6172448603
ADMOB_INTERSTITIAL_ID=ca-app-pub-1211591848059765/8471308886
USE_REAL_ADS=true

# Play versionCode / versionName. Bump both by hand for every Play upload (versionCode must
# always be higher than the last upload). CI no longer derives versionCode from the run number.
VERSION_CODE=19
VERSION_NAME=1.0.4
