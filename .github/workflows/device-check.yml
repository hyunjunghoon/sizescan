name: Device check

# Emulator run of the main user flows (README rule 11 step 2): app start, sharing a 22-page PDF
# into SizeScan and fitting it under 200 KB, sharing photos. Debug build = Google test ad IDs.
on:
  workflow_dispatch:
  push:
    branches: [main, device-check]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            ram: 2048M   # low-memory phone
          - api: 34
            ram: 4096M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator tests (API ${{ matrix.api }}, RAM ${{ matrix.ram }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon connectedDebugAndroidTest || (adb logcat -d | grep -E 'AndroidRuntime|docscan|sizescan|SizeScan|TestRunner|ActivityTaskManager|Exception' | tail -300; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-check-api${{ matrix.api }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
